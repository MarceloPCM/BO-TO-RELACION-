<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard BO PCM</title>
<style>
:root{
  color-scheme:light;
  --bg:#f9f9f7;--surface:#fcfcfb;--surface2:#f3f2ee;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;
  --grid:#e1e0d9;--axis:#c3c2b7;--border:rgba(11,11,11,.12);--accent:#2a78d6;--accent-ink:#fff;
  --pt:#0ca30c;--pt-bg:rgba(12,163,12,.17);
  --ret:#d03b3b;--ret-bg:rgba(208,59,59,.15);
  --fact:#f2b01e;--fact-bg:rgba(250,178,25,.30);
  --plan:#2a78d6;--plan-bg:rgba(42,120,214,.16);
  --lib:#4fc3f7;--lib-bg:rgba(79,195,247,.24);
  --otro:#898781;--otro-bg:transparent;
  --over-bg:rgba(208,59,59,.27);--over:#d03b3b;
  --shadow:0 8px 30px rgba(0,0,0,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0d0d0d;--surface:#1a1a19;--surface2:#242422;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;
  --grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,.12);--accent:#3987e5;
  --pt:#0ca30c;--pt-bg:rgba(12,163,12,.26);--ret:#e66767;--ret-bg:rgba(230,103,103,.22);
  --fact:#fab219;--fact-bg:rgba(250,178,25,.26);--plan:#3987e5;--plan-bg:rgba(57,135,229,.28);
  --lib:#4fc3f7;--lib-bg:rgba(79,195,247,.24);--over-bg:rgba(230,103,103,.36);--over:#e66767;--shadow:0 8px 30px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d0d0d;--surface:#1a1a19;--surface2:#242422;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;
  --grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,.12);--accent:#3987e5;
  --pt:#0ca30c;--pt-bg:rgba(12,163,12,.26);--ret:#e66767;--ret-bg:rgba(230,103,103,.22);
  --fact:#fab219;--fact-bg:rgba(250,178,25,.26);--plan:#3987e5;--plan-bg:rgba(57,135,229,.28);
  --lib:#4fc3f7;--lib-bg:rgba(79,195,247,.24);--over-bg:rgba(230,103,103,.36);--over:#e66767;--shadow:0 8px 30px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 11px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--ret)}
.btn.sm{padding:3px 8px;font-size:12px}
input[type=text],input[type=search],input[type=date],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 9px;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
header.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
header.top h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px}
header.top .sub{color:var(--ink2);font-size:12px}
header.top .sp{flex:1}
header.top label{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);font-size:12px}
#drop{display:none;position:fixed;inset:0;z-index:50;background:rgba(42,120,214,.88);color:#fff;align-items:center;justify-content:center;font-size:26px;font-weight:700}
body.dragging #drop{display:flex}
nav.tabs{display:flex;gap:2px;padding:8px 16px 0;background:var(--bg);overflow-x:auto;border-bottom:1px solid var(--border);align-items:flex-end}
.tab{border:1px solid transparent;border-bottom:none;background:transparent;padding:7px 14px;border-radius:8px 8px 0 0;color:var(--ink2);white-space:nowrap;font-weight:500}
.tab:hover{background:var(--surface2)}
.tab.active{background:var(--surface);color:var(--ink);border-color:var(--border);font-weight:700;margin-bottom:-1px;padding-bottom:8px}
.tab .cnt{color:var(--muted);font-weight:400;margin-left:4px}
.tab.add{color:var(--accent)}
.tab.graf{margin-left:auto}
main{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px 16px 12px;gap:10px;background:var(--surface);border-top:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kpi{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:8px 12px;border-left:4px solid var(--axis)}
.kpi .l{color:var(--ink2);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:22px;font-weight:700;line-height:1.15}
.kpi .s{color:var(--muted);font-size:11px}
.kpi.pt{border-left-color:var(--pt)}.kpi.ov{border-left-color:var(--over)}.kpi.plan{border-left-color:var(--plan)}.kpi.lib{border-left-color:var(--lib)}.kpi.ret{border-left-color:var(--ret)}.kpi.fact{border-left-color:var(--fact)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .sp{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;display:inline-flex;align-items:center;gap:6px}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--otro)}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip small{opacity:.7}
.dot.pt{background:var(--pt)}.dot.ret{background:var(--ret)}.dot.fact{background:var(--fact)}.dot.plan{background:var(--plan)}.dot.lib{background:var(--lib)}.dot.ov{background:var(--over)}
.wrap{position:relative}
.pop{position:absolute;z-index:30;top:calc(100% + 4px);left:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:10px;width:320px;max-width:92vw}
.pop.right{left:auto;right:0}
.picker .list{max-height:260px;overflow:auto;margin-top:8px;border:1px solid var(--grid);border-radius:8px}
.picker label.row{display:flex;gap:8px;align-items:center;padding:4px 8px;border-bottom:1px solid var(--grid);cursor:pointer}
.picker label.row:hover{background:var(--surface2)}
.picker label.row .n{margin-left:auto;color:var(--muted);font-size:11px}
.picker .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.tablewrap{flex:1;min-height:200px;overflow:auto;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
table.m{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:12px}
table.m th{position:sticky;top:0;z-index:3;background:var(--surface2);text-align:left;padding:6px 8px;border-bottom:1px solid var(--axis);border-right:1px solid var(--grid);white-space:nowrap;cursor:pointer;user-select:none;font-weight:600}
table.m th:hover{background:var(--grid)}
table.m th .ar{color:var(--accent);margin-left:3px}
table.m td{--cell:var(--surface);padding:3px 8px;border-bottom:1px solid var(--grid);border-right:1px solid var(--grid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px;background:linear-gradient(var(--tint,transparent),var(--tint,transparent)),var(--surface)}
table.m.dense td{padding:1px 7px;font-size:11.5px}
table.m td.num{text-align:right;font-variant-numeric:tabular-nums}
table.m th.stk,table.m td.stk{position:sticky;left:0;z-index:2;border-right:2px solid var(--axis)}
table.m th.stk{z-index:4}
table.m tr:hover td{filter:brightness(.96)}
table.m td{cursor:text;user-select:text}
table.m td.stk,table.m td.nt{cursor:pointer}
table.m td.stk{font-weight:600;color:var(--accent)}
table.m tr.sel td{outline:1px solid var(--accent)}
.m-both tr.ov,.m-over tr.ov{--tint:var(--over-bg)}
.m-both tr.ov td.stk,.m-over tr.ov td.stk{box-shadow:inset 5px 0 0 var(--over)}
.m-both tr.st-pt:not(.ov),.m-status tr.st-pt{--tint:var(--pt-bg)}
.m-both tr.st-ret:not(.ov),.m-status tr.st-ret{--tint:var(--ret-bg)}
.m-both tr.st-fact:not(.ov),.m-status tr.st-fact{--tint:var(--fact-bg)}
.m-both tr.st-plan:not(.ov),.m-status tr.st-plan{--tint:var(--plan-bg)}
.m-both tr.st-lib:not(.ov),.m-status tr.st-lib{--tint:var(--lib-bg)}
tr.ov td.dv{font-weight:700;color:var(--over)}
td.ed{box-shadow:inset 0 -2px 0 var(--accent)}
.badge{display:inline-block;padding:0 8px;border-radius:5px;font-weight:600;font-size:11.5px;border:1px solid transparent}
.badge.pt{background:var(--pt);color:#fff}.badge.ret{background:var(--ret);color:#fff}.badge.fact{background:var(--fact);color:#2a1f00}.badge.plan{background:var(--plan);color:#fff}.badge.lib{background:var(--lib);color:#06283a}
.badge.otro{background:transparent;border-color:var(--axis);color:var(--ink2)}
.new{background:var(--accent);color:#fff;font-size:9.5px;border-radius:4px;padding:0 4px;margin-left:5px;font-weight:700}
.chg{color:var(--accent);margin-left:4px;cursor:help}
.nbtn{border:1px solid var(--border);background:var(--surface);border-radius:6px;padding:0 6px;font-size:11px}
.nbtn.has{background:var(--accent);color:#fff;border-color:var(--accent)}
td.nt{max-width:320px}
.status{color:var(--ink2);font-size:12px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:none}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--surface);z-index:41;box-shadow:var(--shadow);display:none;flex-direction:column}
.drawer.on{display:flex}
.drawer .hd{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start}
.drawer .hd h2{margin:0;font-size:15px}
.drawer .hd .x{margin-left:auto}
.drawer .bd{padding:12px 16px;overflow:auto;flex:1}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.fgrid .f{display:flex;flex-direction:column;gap:2px}
.fgrid .f.full{grid-column:1/-1}
.fgrid label{font-size:11px;color:var(--ink2);display:flex;gap:6px;align-items:center}
.fgrid label .rv{margin-left:auto;color:var(--accent);cursor:pointer;font-size:11px;text-decoration:underline}
.fgrid input{width:100%}
.fgrid .edited input{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.notes h3,.sec h3{font-size:13px;margin:16px 0 6px}
.note{border:1px solid var(--grid);border-radius:8px;padding:6px 10px;margin-bottom:6px;background:var(--bg)}
.note .ts{font-size:11px;color:var(--muted);display:flex;gap:8px}
.note .ts .del{margin-left:auto;cursor:pointer;color:var(--ret)}
.note .tx{white-space:pre-wrap;outline:none}
textarea#newnote{width:100%;min-height:64px;resize:vertical}
/* modal */
.modal{position:fixed;z-index:60;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.4);padding:16px}
.modal.on{display:flex}
.modal .box{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);width:min(520px,100%);max-height:90vh;overflow:auto;padding:16px}
.modal h2{margin:0 0 10px;font-size:16px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.modal ul{margin:6px 0 6px 18px;padding:0}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:8px;z-index:70;display:none;max-width:90vw}
#tip{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:var(--surface);padding:5px 9px;border-radius:6px;font-size:12px;display:none;max-width:280px}
/* graficos */
.gwrap{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px}
.gtop{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:12px}
@media(max-width:520px){.cards{grid-template-columns:1fr}}
.card{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{margin:0;font-size:14px}
.card .q{color:var(--ink2);font-size:12px;margin-top:-6px}
.hero{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hero .big{font-size:34px;font-weight:700;line-height:1}
.hero .u{color:var(--ink2)}
.hero .st{margin-left:auto;color:var(--ink2);font-size:12px;text-align:right}
.seg{display:flex;gap:2px;height:16px}
.seg>div{border-radius:4px;min-width:2px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hb{display:grid;grid-template-columns:minmax(90px,170px) 1fr auto;gap:8px;align-items:center;margin:3px 0}
.hb .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2);font-size:12px}
.hb .t{background:var(--grid);border-radius:0 5px 5px 0;height:12px;position:relative}
.hb .t.trk{background:var(--grid)}
.hb .f{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;min-width:2px}
.hb .v{font-variant-numeric:tabular-nums;font-size:12px;min-width:56px;text-align:right}
.vb{display:flex;gap:6px;align-items:flex-end;height:170px;border-bottom:1px solid var(--axis);padding-top:18px}
.vb .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.vb .c .bar{width:70%;max-width:46px;border-radius:4px 4px 0 0;min-height:2px}
.vb .c .val{font-size:11.5px;margin-bottom:2px;font-variant-numeric:tabular-nums}
.vbl{display:flex;gap:6px}
.vbl div{flex:1;text-align:center;font-size:11px;color:var(--muted);padding-top:3px;min-width:0}
details.dt summary{cursor:pointer;color:var(--accent);font-size:12px}
details.dt table{border-collapse:collapse;width:100%;font-size:12px;margin-top:6px}
details.dt td,details.dt th{border-bottom:1px solid var(--grid);padding:2px 6px;text-align:left}
details.dt td:last-child,details.dt th:last-child{text-align:right}
.empty{padding:30px;text-align:center;color:var(--muted)}
.note-info{font-size:12px;color:var(--ink2);background:var(--bg);border:1px dashed var(--axis);border-radius:8px;padding:6px 10px}
/* ---- v2 ---- */
.btn.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.vtab{cursor:grab}
.vtab.dragging{opacity:.45}
.vtab.dragover,.tab.dragover{box-shadow:inset 4px 0 0 var(--accent)}
[data-dr]{cursor:pointer}
.hb[data-dr]:hover .l{color:var(--ink);text-decoration:underline}
.hb[data-dr]:hover .f,.vb .c[data-dr]:hover .bar,.sg:hover,.seg>div[data-dr]:hover{filter:brightness(1.12)}
.vb .c[data-dr]:hover{background:var(--surface2);border-radius:4px}
.kpi[data-dr]:hover{background:var(--surface2)}
.t.sk{display:flex;gap:2px;background:transparent;overflow:hidden}
.t.sk .sg{min-width:2px;height:100%}
.card.wide{grid-column:1/-1}
.chk label{display:flex;gap:7px;align-items:center;padding:3px 0;cursor:pointer}
.chk label small{margin-left:auto;color:var(--muted)}
.chk.cols{columns:2;column-gap:12px}
.acts2{display:flex;gap:6px;margin:6px 0}
#fpanel{position:fixed;top:0;right:0;bottom:0;width:390px;max-width:100vw;background:var(--surface);z-index:35;box-shadow:var(--shadow);border-left:1px solid var(--border);display:none;flex-direction:column}
#fpanel.on{display:flex}
body.fp-open main{margin-right:390px}
@media(max-width:900px){body.fp-open main{margin-right:0}#fpanel{width:100vw}}
#fpanel .hd{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start}
#fpanel .hd .x{margin-left:auto}
#fpanel .bd{flex:1;overflow:auto;padding:10px 14px}
#fpanel .ft{padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:space-between}
#fpanel details{border-bottom:1px solid var(--grid);padding:8px 0}
#fpanel summary,.gdet summary{cursor:pointer;font-weight:600}
#fpanel summary small{color:var(--muted);font-weight:400}
.gwrap #gctl{display:flex;flex-direction:column;gap:8px}
.gtop{position:relative}
.gdet{position:relative;display:inline-block}
.gdet>summary{list-style:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-weight:500;white-space:nowrap}
.gdet>summary::-webkit-details-marker{display:none}
.gdet[open]>summary{border-color:var(--accent)}
.gpop{position:absolute;z-index:30;top:calc(100% + 4px);left:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:10px;width:340px;max-width:92vw;max-height:70vh;overflow:auto}
.gcustom{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--bg);border:1px dashed var(--accent);border-radius:10px;padding:8px 12px}
.gcustom label{display:inline-flex;gap:6px;align-items:center;color:var(--ink2);font-size:12px}
tr.flash td{animation:flash 2.4s ease-out 1}
@keyframes flash{0%,40%{outline:2px solid var(--accent);outline-offset:-2px}100%{outline:2px solid transparent}}
.modal .box.wide{width:min(940px,100%)}
.pdfgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
@media(max-width:760px){.pdfgrid{grid-template-columns:1fr}}
.pdfgrid h3{margin:10px 0 4px;font-size:13px}
.pdfgrid .list{max-height:230px;overflow:auto;border:1px solid var(--grid);border-radius:8px}
.pdfcount{font-weight:700;color:var(--accent)}
.pdfbtns{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.picker .list{max-height:230px}

tr.grp td{background:var(--surface2);border-bottom:1px solid var(--axis);cursor:pointer;padding:5px 8px}
tr.grp.tot td{cursor:default;background:var(--grid)}
tr.grp .gin{position:sticky;left:8px;display:flex;gap:16px;align-items:baseline;width:max-content;max-width:calc(100vw - 80px);font-size:12.5px}
tr.grp .gin span{color:var(--ink2);font-weight:400}
tr.grp .gin span.sm b{color:var(--ink);font-variant-numeric:tabular-nums}
.kpi.ml{border-left-color:#6b6bc4}.kpi.val{border-left-color:#7a5aa8}

[hidden]{display:none!important}
.kpi{min-width:0}.kpi .v{font-size:19px;white-space:nowrap}

:root{--s2:#eb6834}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--s2:#d95926}}
:root[data-theme="dark"]{--s2:#d95926}
.vx{margin-left:8px;opacity:0;color:var(--muted);font-size:11px;padding:0 3px;border-radius:4px}
.vtab:hover .vx,.vtab.active .vx{opacity:.8}
.vx:hover{opacity:1!important;color:var(--ret);background:var(--surface2)}
.cmpctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cmpctl label{display:inline-flex;gap:6px;align-items:center;color:var(--ink2);font-size:12px}
.cmpgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.cmpm{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.cmpm b{font-size:12px}
.pb{display:grid;grid-template-columns:minmax(110px,230px) 1fr;gap:10px;margin:7px 0;align-items:center}
.pb .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2);font-size:12px}
.pb .bb{display:flex;flex-direction:column;gap:2px}
.pb .row{display:flex;align-items:center;gap:8px}
.pb .t{flex:1;height:9px;position:relative;background:var(--grid);border-radius:0 5px 5px 0}
.pb .f{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;min-width:1px}
.pb .v{min-width:74px;text-align:right;font-size:11.5px;font-variant-numeric:tabular-nums}
.pb .row[data-dr]:hover .f{filter:brightness(1.12)}

/* ---- Avance PT ---- */
.pt-c{min-width:150px;white-space:nowrap}
.pgb{position:relative;height:18px;width:100%;min-width:120px;background:var(--surface);border:1px solid var(--axis);border-radius:5px;overflow:hidden;margin-bottom:2px}

async function inflateRaw(u8){

  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const files={};const dec=new TextDecoder();
  for(let i=0;i<n;i++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lho=dv.getUint32(p+42,true);
    files[dec.decode(u8.subarray(p+46,p+46+nl))]={method,csize,lho};p+=46+nl+el+cl;
  }
  return async name=>{const f=files[name];if(!f)return null;const l=f.lho,s=l+30+dv.getUint16(l+26,true)+dv.getUint16(l+28,true);
    const d=u8.subarray(s,s+f.csize);return dec.decode(f.method===0?d:await inflateRaw(d))};
}

async function readXlsx(buf){

  for(const sh of sheets){
    const raw=await get(sh.path);if(!raw)continue;
    const doc=xml(raw);const grid=[],hidden=new Set();let lastRi=-1;
    for(const row of doc.getElementsByTagName('row')){
      const ra=row.getAttribute('r'),ri=ra?+ra-1:lastRi+1;lastRi=ri;const arr=[];
      const hd=row.getAttribute('hidden');if(hd==='1'||hd==='true')hidden.add(ri);
      for(const c of row.getElementsByTagName('c')){
        const ref=c.getAttribute('r'),ci=ref?colIdx(ref):arr.length,t=c.getAttribute('t'),v=c.getElementsByTagName('v')[0];let val=null;
        if(t==='s')val=v?ss[+v.textContent]:null;

function gridToRows(grid,hidden){

  if(h<0)throw new Error('No encontré la fila de encabezados (columna "No. Pedido") en las primeras filas de la hoja.');
  const map={},ignored=[];let vnCol=-1;const vnames={};
  (grid[h]||[]).forEach((c,i)=>{if(c==null||c==='')return;const k=NORMKEY[norm(c)];if(k==='vendname'){vnCol=i;return}if(k&&!Object.values(map).includes(k))map[i]=k;else ignored.push(String(c).replace(/\s+/g,' ').trim())});
  const found=new Set(Object.values(map)),missing=KEYS.filter(k=>!found.has(k));
  const rows=[];let hiddenN=0,oddN=0,skipped=0;
  for(let i=h+1;i<grid.length;i++){
    const r=grid[i];if(!r)continue;
    const v=KEYS.map(()=>null);
    for(const ci in map){const k=map[ci];let x=r[ci];if(x===undefined||x==='')x=null;
      if(x!=null){const ty=TYPE[k];
        if(ty==='t'){x=String(x).trim();if(x==='')x=null}
        else if(ty==='d'){if(typeof x==='string'){const d=parseDateStr(x);x=d!=null?d:(x.trim()||null)}}
        else{if(typeof x==='string'){const n=parseFloat(x.replace(/[,$\s]/g,''));x=isNaN(n)?null:n}}}

    const ped=String(v[IDX.pedido]);
    const odd=/^(sub)?total|^suma\b|^gran total/i.test(ped)||(v[IDX.cliente]==null&&v[IDX.info]==null);
    const hid=!!(hidden&&hidden.has(i));
    if(hid)hiddenN++;if(odd)oddN++;

function csvToRes(text){return {sheet:'CSV',...gridToRows(csvGrid(text),new Set())}}
function csvGrid(text){
  text=text.replace(/^﻿/,'');
  const first=text.split(/\r?\n/,1)[0],dl=[';','\t',','].map(d=>[d,first.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const grid=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;else if(ch===dl){row.push(cur);cur=''}

    else cur+=ch}

function stats(list){
  const st={total:list.length,ml:0,val:0,allIds:[],g:{pt:0,lib:0,plan:0,ret:0,fact:0,otro:0},gIds:{pt:[],lib:[],plan:[],ret:[],fact:[],otro:[]},ov:0,hoy:0,fut:0,nod:0,sumO:0,sumA:0,maxO:0,arrO:[],

  for(const r of list){

function pairBars(items,fmt){
  const m=Math.max(...items.flatMap(i=>[i.a.v,i.b.v]),1e-9);
  const row=(x,col)=>`<div class="row"${dr(x.dr)} ${tipAttr(x.tip)}><div class="t"><div class="f" style="width:${Math.max(100*x.v/m,x.v?.5:0)}%;background:${col}"></div></div><span class="v">${fmt(x.v)}</span></div>`;
  return items.map(i=>`<div class="pb"><div class="l" title="${esc(i.label)}">${esc(i.label)}</div><div class="bb">${row(i.a,CMPA)}${row(i.b,CMPB)}</div></div>`).join('');
}
function cmpCard(c){
  const cm=S.ui.g.cmp,cur=monthKey(S.consulta),a=cm.a!=null?cm.a:cur,b=cm.b!=null?cm.b:cur+1;
  const by={};for(const r of c.list){const d=due(r);if(d==null)continue;const k=monthKey(d);(by[k]||(by[k]=[])).push(r)}
  const A=by[a]||[],B=by[b]||[],sa=sums(A),sb=sums(B);
  const lab=k=>monthLong(k)+(k===cur?' (actual)':k===cur+1?' (siguiente)':'');
  const ids=l=>l.map(r=>r.id);
  const keys=new Set([cur,cur+1,a,b,...Object.keys(by).map(Number)]);
  const mopts=[...keys].sort((x,y)=>x-y).map(k=>`<option value="${k}">${esc(lab(k))}</option>`).join('');
  const optA=`<option value="auto">Mes actual (automático)</option>`+mopts,optB=`<option value="auto">Mes siguiente (automático)</option>`+mopts;
  const pick=(opts,v)=>opts.replace(`<option value="${v}">`,`<option value="${v}" selected>`);
  const pct2=(x,y)=>y?((x-y)/y*100>=0?'+':'')+((x-y)/y*100).toFixed(0)+'%':(x?'nuevo':'—');
  const fmt0=v=>fmtN(v,0);
  const metric=(t,va,vb,fm)=>`<div class="cmpm"><b>${t}</b>${hbars([{label:lab(a),value:va,color:CMPA,dr:reg(ids(A),lab(a)),tip:lab(a)+': '+fm(va)},{label:lab(b),value:vb,color:CMPB,dr:reg(ids(B),lab(b)),tip:lab(b)+': '+fm(vb)}],{fmt:fm})}<div class="status">${esc(monthLong(b))} vs ${esc(monthLong(a))}: <b style="color:${vb>=va?'var(--ink)':'var(--over)'}">${vb-va>=0?'+':''}${fm(vb-va)}</b> (${pct2(vb,va)})</div></div>`;
  const keysG=Object.keys(GROUPS);
  const stk=[a,b].map(k=>{const L=by[k]||[],parts={};for(const g of keysG){const x=L.filter(r=>c.st._g[r.id]===g);parts[g]={n:x.length,dr:reg(ids(x),lab(k)+' · '+GROUPS[g])}}return{label:lab(k),total:L.length,parts}});
  const mx=Math.max(...stk.map(i=>i.total),1);
  // por dimensión
  const dim=CMPDIMS.includes(cm.dim)?cm.dim:'vend',dfn=DIMS[dim][1],mm=CMPM[cm.measure]?cm.measure:'n';
  const mval=L=>mm==='n'?L.length:mm==='ml'?L.reduce((s,r)=>s+num(val(r,'ml')),0):L.reduce((s,r)=>s+num(val(r,'total')),0);
  const g={};for(const r of A){const k=dfn(r);(g[k]||(g[k]={A:[],B:[]})).A.push(r)}for(const r of B){const k=dfn(r);(g[k]||(g[k]={A:[],B:[]})).B.push(r)}
  let arr=Object.entries(g).map(([k,x])=>({k,x,va:mval(x.A),vb:mval(x.B)})).sort((p,q)=>(q.va+q.vb)-(p.va+p.vb));
  const top=cm.top||0;const shown=top?arr.slice(0,top):arr;
  const items=shown.map(o=>({label:dimLabel(dim,o.k),a:{v:o.va,dr:reg(ids(o.x.A),dimLabel(dim,o.k)+' · '+lab(a)),tip:`${dimLabel(dim,o.k)} · ${lab(a)}: ${fmt0(o.va)}`},b:{v:o.vb,dr:reg(ids(o.x.B),dimLabel(dim,o.k)+' · '+lab(b)),tip:`${dimLabel(dim,o.k)} · ${lab(b)}: ${fmt0(o.vb)}`}}));
  const sel=(id,opts,v)=>`<select id="${id}">${opts.replace(`value="${v}"`,`value="${v}" selected`)}</select>`;
  const dopts=CMPDIMS.map(k=>`<option value="${k}">${esc(DIMS[k][0])}</option>`).join(''),mopt=Object.entries(CMPM).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
  const topopt=[5,8,12,20,0].map(n=>`<option value="${n}">${n?'Top '+n:'Todos'}</option>`).join('');
  return `<div class="card wide"><h3>Comparar mes actual vs. mes siguiente</h3><div class="q">Según la fecha de vencimiento (F. Venci. Ped) de cada pedido. Clic en una barra para ver esos pedidos.</div>
   <div class="cmpctl"><label>Mes A <select id="cmpa">${pick(optA,cm.a!=null?cm.a:'auto')}</select></label><label>contra Mes B <select id="cmpb">${pick(optB,cm.b!=null?cm.b:'auto')}</select></label></div>
   <div class="legend"><span><i style="background:${CMPA}"></i>${esc(lab(a))}</span><span><i style="background:${CMPB}"></i>${esc(lab(b))}</span></div>
   <div class="cmpgrid">${metric('Pedidos',sa.n,sb.n,fmt0)}${metric('ML total',sa.ml,sb.ml,fmt0)}${metric('Valor (Total)',sa.v,sb.v,fmt0)}</div>
   ${sub('Estatus de los pedidos de cada mes')}${stackBars(stk,keysG,mx)}<div class="legend">${keysG.map(k=>`<span><i style="background:${GCOLOR[k]}"></i>${GROUPS[k]}</span>`).join('')}</div>
   <div class="cmpctl" style="margin-top:8px"><b style="font-size:12px">Por</b>${sel('cmpd',dopts,dim)}<b style="font-size:12px">medir</b>${sel('cmpm',mopt,mm)}${sel('cmptop',topopt,top)}</div>
   ${items.length?pairBars(items,fmt0):'<div class="empty">Sin pedidos con vencimiento en esos meses</div>'}
   ${dataTable([DIMS[dim][0],lab(a),lab(b)],shown.map(o=>[dimLabel(dim,o.k),fmt0(o.va),fmt0(o.vb)]))}</div>`;
}

const DIMS={cliente:['Cliente',r=>val(r,'cliente')||'(sin cliente)'],info:['INFO',r=>val(r,'info')||'(vacío)'],grupo:['Estatus (por color)',r=>GROUPS[gOf(r)]],abcd:['ABCD',r=>val(r,'abcd')||'—'],
 vend:['Vendedor',r=>{const v=val(r,'vend');return v==null?'(sin vendedor)':String(v)}],um:['Unidad de medida',r=>val(r,'um')||'—'],
 mesven:['Mes de vencimiento',r=>{const d=due(r);return d==null?null:monthKey(d)},true],mesped:['Mes del pedido',r=>{const v=val(r,'fped');return isDateLike(v)?monthKey(v):null},true]};
const MEAS={n:['Número de pedidos'],ov:['Pedidos vencidos'],pt:['Pedidos en PT'],pov:['% de pedidos vencidos'],avgo:['Promedio de días de atraso'],avga:['Promedio de días de adelanto'],ml:['ML total'],val:['Valor (columna Total)']};
function customChart(c){
  const cf=S.ui.g.custom,dim=DIMS[cf.dim]||DIMS.cliente,time=!!dim[2];const m=new Map();
  for(const r of c.list){const k=dim[1](r);if(k==null)continue;
    const g=m.get(k)||m.set(k,{k,ids:[],ov:[],pt:[],fut:[],sumO:0,sumA:0,ml:0,val:0}).get(k);g.ids.push(r.id);g.ml+=num(val(r,'ml'));g.val+=num(val(r,'total'));
    if(gOf(r)==='pt')g.pt.push(r.id);const d=due(r);if(d!=null){const df=S.consulta-d;if(df>0){g.ov.push(r.id);g.sumO+=df}else if(df<0){g.fut.push(r.id);g.sumA+=-df}}}
  let arr=[...m.values()].map(g=>{let v,ids=g.ids;
    switch(cf.measure){case'ov':v=g.ov.length;ids=g.ov;break;case'pt':v=g.pt.length;ids=g.pt;break;case'pov':v=100*g.ov.length/g.ids.length;ids=g.ov;break;
      case'avgo':v=g.ov.length?g.sumO/g.ov.length:null;ids=g.ov;break;case'avga':v=g.fut.length?g.sumA/g.fut.length:null;ids=g.fut;break;case'ml':v=g.ml;break;case'val':v=g.val;break;default:v=g.ids.length}
    return{k:g.k,v,ids,n:g.ids.length}}).filter(g=>g.v!=null);
  const isInt=['n','ov','pt','ml','val'].includes(cf.measure),ftxt=v=>cf.measure==='pov'?fmt1(v)+' %':isInt?fmtN(v,0):fmt1(v)+' d';
  const color=['ov','pov','avgo'].includes(cf.measure)?'var(--over)':cf.measure==='pt'?'var(--pt)':'var(--accent)';

/* ============ Carga de archivo diario ============ */
async function loadFile(file){
  try{
    const n=file.name;let res;
    if(/\.xls$/i.test(n))throw new Error('El formato .xls antiguo no se puede leer: ábrelo en Excel y guárdalo como .xlsx.');
    toast('Leyendo '+n+'…');
    if(/\.csv$/i.test(n))res=csvToRes(await file.text());
    else if(/\.xls[xm]$/i.test(n))res=await readXlsx(await file.arrayBuffer());
    else throw new Error('Selecciona un archivo de Excel (.xlsx) o un CSV.');
    const good=res.rows.filter(r=>!r.odd);
    if(!good.length)throw new Error('El archivo no tiene filas de pedidos.');
    const nh=good.filter(r=>r.hidden).length;
    if(nh>0){
      resetBox();
      $('#modalbox').innerHTML=`<h2>Este Excel tiene filtros aplicados</h2>
       <p><b>${nh.toLocaleString()}</b> de ${good.length.toLocaleString()} pedidos están ocultos por filtros de Excel (hoja “${esc(res.sheet)}”). ¿Cómo los cargo?</p>
       <div style="display:flex;flex-direction:column;gap:8px">
        <button class="btn primary" id="ldAll">Cargar todos los pedidos (quitar los filtros del Excel)</button>
        <button class="btn" id="ldVis">Cargar solo los ${(good.length-nh).toLocaleString()} visibles (respetar los filtros del Excel)</button>
        <button class="btn" id="ldCancel">Cancelar</button></div>
       <p class="status">Los filtros del Excel no se modifican en tu archivo; solo decides qué filas entran al dashboard.</p>`;
      $('#modal').classList.add('on');
      $('#ldAll').onclick=()=>{closeModal();finishLoad(res,n,true)};
      $('#ldVis').onclick=()=>{closeModal();finishLoad(res,n,false)};
      $('#ldCancel').onclick=closeModal;
    }else finishLoad(res,n,true);
  }catch(e){if(await ptFallback(file,e))return;showMsg('No se pudo cargar el archivo',`<p>${esc(e.message)}</p><p class="status">Si el archivo es un reporte con otro formato, mándame un ejemplo para que lo adapte.</p>`)}
}
function finishLoad(res,name,incHidden){
  const good=res.rows.filter(r=>!r.odd);
  const vs=good.filter(r=>incHidden||!r.hidden).map(r=>r.v);
  const hidN=good.filter(r=>r.hidden).length;
  applyNewData({rows:vs,missing:res.missing,ignored:res.ignored,sheet:res.sheet,vnames:res.vnames},name,{
    hid:hidN,incHidden,odd:res.oddN,headerRow:res.headerRow,skipped:res.skipped});
}
function applyNewData(res,name,x){
  x=x||{};
  const prev=new Map(S.rows.map(r=>[r.id,r]));
  const ids=new Set(),dup=[],rows=[];
  for(const v of res.rows){let id=String(v[IDX.pedido]);if(ids.has(id)){dup.push(id);let n=2;while(ids.has(id+'#'+n))n++;id=id+'#'+n}ids.add(id);rows.push({id,v})}
  const newIds=[],changed={},removed=[];
  if(prev.size){
    for(const r of rows){const p=prev.get(r.id);if(!p)newIds.push(r.id);else{const a=p.v[IDX.info],b=r.v[IDX.info];if(String(a||'')!==String(b||''))changed[r.id]=[a==null?'(vacío)':a,b==null?'(vacío)':b]}}
    for(const [id,p] of prev)if(!ids.has(id))removed.push({id,cliente:p.v[IDX.cliente],info:p.v[IDX.info]})}
  let kept=0,dropped=0;
  const byId=new Map(rows.map(r=>[r.id,r]));
  for(const id of Object.keys(S.overrides)){const r=byId.get(id);if(!r)continue;
    for(const k of Object.keys(S.overrides[id])){const o=S.overrides[id][k],b=r.v[IDX[k]];
      if(JSON.stringify(b==null?null:b)===JSON.stringify(o.base==null?null:o.base)){o.base=b;kept++}else{delete S.overrides[id][k];dropped++}}
    if(!Object.keys(S.overrides[id]).length)delete S.overrides[id]}
  const orphanNotes=Object.keys(S.notes).filter(id=>!ids.has(id)&&S.notes[id].length).length;
  let vnN=0;for(const c in (res.vnames||{})){if(!S.vendNames[c]){S.vendNames[c]=res.vnames[c];vnN++}}
  S.rows=rows;S.fileName=name;S.loadedAt=Date.now();S.embedded=false;

  for(const s of wb.getElementsByTagName('sheet')){
    const rid=s.getAttribute('r:id')||s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');

  return new Promise((res,rej)=>{

    const fin=f=>{if(done)return;done=true;clearTimeout(tm);sc.remove();window.google=prev;f()};
    const tm=setTimeout(()=>fin(()=>rej(new Error('sin respuesta (bloqueado o sin acceso)'))),25000);

      const cv=c=>{if(!c||c.v==null)return null;const v=c.v;if(typeof v==='string'){const m=v.match(/^Date\((\d+),(\d+),(\d+)/);if(m&&+m[1]>1900)return Math.floor(Date.UTC(+m[1],+m[2],+m[3])/DAY)+25569;if(m)return c.f||null}return v};

  });
}
async function fetchCsvText(url){
  const cleanUrl = sheetCsvUrl(url);
  try {
    const r = await fetch(cleanUrl, { cache: 'no-store' });
    if (r.ok) {
      const tx = await r.text();
      if (!/^\s*<(!doctype|html)/i.test(tx)) return tx;
    }
  } catch(e) {}

  const proxies = [
    'https://api.allorigins.win/raw?url=' + encodeURIComponent(cleanUrl),
    'https://corsproxy.io/?' + encodeURIComponent(cleanUrl),
    'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(cleanUrl)
  ];
  for (const p of proxies) {
    try {
      const r = await fetch(p, { cache: 'no-store' });
      if (r.ok) {
        const tx = await r.text();
        if (!/^\s*<(!doctype|html)/i.test(tx)) return tx;
      }
    } catch(e) {}
  }
  throw new Error('El navegador o la red bloquearon la conexión (Failed to fetch/CORS).');
}

const ptTabsTxt=()=>S.pt?S.pt.tabs.map(t=>t.tab.replace(/ 20\d\d$/,'')+(t.stale?' (datos guardados)':'')).join(', ')+(S.pt.fail&&S.pt.fail.length?' · NO se pudo leer: '+S.pt.fail.join(', '):''):'';
function ptStatusBtn(){const b=$('#ptbtn');if(!b)return;const bad=ptOn()&&S.pt.fail&&S.pt.fail.length;b.textContent=bad?'📦 Relación a PT ⚠':'📦 Relación a PT';b.title=ptOn()?'Hojas: '+ptTabsTxt()+' · sincronizado '+stamp(S.pt.loadedAt):'Relación de material a PT'}
const ptAfter=cols=>cols.some(c=>c[0]==='info')?'info':'pedido';
function ptCell(r){const p=ptInfo(r);
  if(p.st==='sin')return`<td class="pt-c" title="${esc(p.hasOt?'La OE '+p.ot+' no aparece en las hojas leídas de la relación ('+ptTabsTxt()+'). Si sí está en la hoja, pulsa 🔄 o revisa 📦 Relación a PT.':'Este pedido no tiene OT')}"><div class="pgb"><b>${p.hasOt?'0%':'—'}</b></div><span class="pgt mut">${p.hasOt?'Sin pase a PT':'Sin OT'}</span></td>`;
  const w=p.pct==null?0:Math.min(100,p.pct*100);
  return`<td class="pt-c" title="${esc(p.tip)}"><div class="pgb"><i class="${p.st}" style="width:${w}%"></i><b>${ptPctTxt(p)}</b></div><span class="pgt">${fmt0(p.passed)}${p.base?' / '+fmt0(p.base):''} ${esc(p.umRaw||'')}${p.multi?' <span class="pm">· '+p.tabs.map(t=>t[0].replace(/ 20\d\d$/,'').slice(0,3)+' '+fmt0(t[1])).join(' + ')+'</span>':''}${p.warn?' <span class="pw">⚠</span>':''}</span></td>`}
function ptKpis(rows,k){
  if(!ptOn())return'';const ids={comp:[],parc:[],sin:[]};for(const r of rows)ids[ptInfo(r).st].push(r.id);const t=rows.length;
  return k('pt','Completos en PT',ids.comp.length.toLocaleString(),pct(ids.comp.length,t)+' · todo lo ordenado ya pasó',ids.comp,'Avance PT: completos')+
   k('fact','Parciales en PT',ids.parc.length.toLocaleString(),pct(ids.parc.length,t)+' · falta pasar una parte',ids.parc,'Avance PT: parciales')+
   k('','Sin pase a PT',ids.sin.length.toLocaleString(),pct(ids.sin.length,t)+' · sin registro en la relación',ids.sin,'Avance PT: sin pase');
}
function ptChart(c){
  if(!ptOn())return card('Avance a PT por OE','Carga la “Relación de material a PT” con el botón 📦 de arriba.','<div class="empty">Sin datos de la relación a PT</div>');
  const ids={comp:[],parc:[],sin:[]};const cli={};
  for(const r of c.list){const p=ptInfo(r);ids[p.st].push(r.id);const n=val(r,'cliente')||'(sin cliente)';const x=cli[n]||(cli[n]={n:0,comp:[],parc:[],ids:[]});x.n++;x.ids.push(r.id);if(p.st==='comp')x.comp.push(r.id);else if(p.st==='parc')x.parc.push(r.id)}
  const t=c.list.length,col={comp:'var(--pt)',parc:'var(--fact)',sin:'var(--grid)'};
  const inc=c.list.filter(r=>gOf(r)==='pt'&&ptInfo(r).st!=='comp').map(r=>r.id);
  const cl=Object.entries(cli).sort((a,b)=>b[1].n-a[1].n).slice(0,10);
  const low=c.list.filter(r=>ptInfo(r).st==='parc').sort((a,b)=>ptInfo(a).pct-ptInfo(b).pct).slice(0,12);
  return card('Avance a PT por OE (Relación de material)','Cuánto de lo ordenado ya pasó de producción a PT, según lo que captura producción. Clic en una barra para ver esos pedidos.',
   `<div class="hero"><span class="big" style="color:var(--pt)">${pct(ids.comp.length,t)}</span><span class="u">${ids.comp.length.toLocaleString()} pedidos completos de ${t.toLocaleString()}</span><span class="st">Parciales: ${ids.parc.length}<br>Sin pase: ${ids.sin.length}</span></div>
   <div class="seg">${['comp','parc','sin'].map(k=>`<div${dr(reg(ids[k],'Avance PT: '+PTST[k]))} style="flex:${ids[k].length};background:${col[k]}" ${tipAttr(PTST[k]+': '+ids[k].length)}></div>`).join('')}</div>
   <div class="legend">${['comp','parc','sin'].map(k=>`<span><i style="background:${col[k]}"></i>${PTST[k]}</span>`).join('')}</div>
   ${inc.length?`<p class="status" style="margin:8px 0 0"><b>${inc.length}</b> pedido(s) con INFO “PT” aún no tienen todo pasado según la relación. <a href="#" data-dr="${reg(inc,'INFO PT sin avance completo')}">Verlos</a></p>`:''}
   ${sub('Completos vs. total por cliente (10 con más pedidos)')}
   ${hbars(cl.map(([n,x])=>({label:n,value:x.comp.length,total:x.n,color:'var(--pt)',vtxt:`${x.comp.length}/${x.n}`,dr:reg(x.ids,n),tip:`${n}: ${x.comp.length} completos, ${x.parc.length} parciales de ${x.n}`})),{track:true})}
   ${low.length?sub('Parciales con menor avance')+hbars(low.map(r=>{const p=ptInfo(r);return{label:r.id+' · '+(val(r,'cliente')||''),value:Math.floor(p.pct*100),vtxt:ptPctTxt(p),color:'var(--fact)',dr:reg([r.id],r.id),tip:ptText(r)}}),{color:'var(--fact)'}):''}
   ${dataTable(['Estado','Pedidos','%'],['comp','parc','sin'].map(k=>[PTST[k],ids[k].length,pct(ids[k].length,t)]))}`,true);
}

function openPtModal(){

  if(on){const m=[...ix.by.keys()].filter(k=>ix.grp.has(k)).length;
    const dif=new Set();for(const [k,o] of ix.by)if(ix.grp.has(k)&&o.sol>0){const b=ix.grp.get(k).reduce((s,x)=>umKey(val(x,'um'))===o.um?s+num(val(x,'cord')):s,0);if(b>0&&Math.abs(b-o.sol)/b>0.01)dif.add(k)}

     ${ix.dups?`<br>${ix.dups} renglón(es) idénticos (misma OE, cantidad, fecha y hora) se ignoraron como doble captura.`:''}
     ${dif.size?`<br>⚠ ${dif.size} OE tienen una cantidad solicitada en la hoja distinta a la del BO (el % usa la del BO).`:''}${S.pt.skip?`<br>${S.pt.skip} renglón(es) con OE pero sin cantidad entregada se omitieron.`:''}</div>
     ${S.pt.fail&&S.pt.fail.length?`<div class="note-info" style="border-color:var(--ret)">⚠ En la última sincronización <b>no se pudo leer</b>: ${esc(S.pt.fail.join(', '))}. Se conservan los últimos datos guardados de esas hojas, pero pueden estar desactualizados.</div>`:''}

     ${ix.unmatched.length?`<details style="margin:6px 0"><summary class="status">OE de la relación que no están en el BO (${ix.unmatched.length}, las más recientes primero)</summary><div class="status">${ix.unmatched.slice(0,40).map(o=>'OE'+String(o.k).padStart(8,'0')+' · '+fmt0(o.passed)+' '+esc(o.umRaw||'')+(o.last!=null?' · '+fmtDate(o.last):'')).join('<br>')}${ix.unmatched.length>40?'<br>…':''}</div></details>`:''}`}
  box.innerHTML=`<h2>📦 Relación de material a PT</h2>
   <p class="status" style="margin-top:0">Producción captura cada pase de material a PT con su <b>OE</b> y la <b>cantidad entregada</b>. El dashboard suma lo entregado por OE y lo compara con la cantidad ordenada del BO (la OE es la columna <b>OT</b> del BO) para mostrar el <b>% de avance</b>: Completo, Parcial o Sin pase.</p>
   ${st}
   <div class="pdfgrid">
    <div>
     <h3>Opción 1 · Cargar el archivo descargado</h3>
     <p class="status">En tu Google Sheets: <b>Archivo → Descargar → Microsoft Excel (.xlsx)</b> (o .csv) y cárgalo aquí. Es 100% inmune a bloqueos de red o políticas de intranet.</p>
     <div class="pdfbtns"><button class="btn primary" id="ptpick">📂 Cargar relación (.xlsx / .csv)</button></div>
     <label class="chk" style="display:block;margin-top:8px"><label><input type="checkbox" id="ptdedupe" ${PTCFG.dedupe!==false?'checked':''}>Ignorar renglones idénticos (misma OE, cantidad, fecha y hora)</label></label>
     
     <h3 style="margin-top:16px">Opción 2 · Pegar texto/CSV copiado</h3>
     <p class="status">Abre tu enlace en el navegador, copia todo el texto (Ctrl+A y Ctrl+C) y pégalo aquí abajo:</p>
     <textarea id="ptpaste" style="width:100%;min-height:75px" placeholder="Pega aquí el contenido copiado de la hoja..."></textarea>
     <div class="pdfbtns"><button class="btn primary sm" id="ptapplypaste">📋 Procesar texto pegado</button></div>
    </div>
    <div>
     <h3>Opción 3 · Enlaces de Google Sheets en vivo</h3>
     <p class="status">Lee automáticamente la hoja si tu red/navegador permite peticiones web externas. Un enlace por línea con su <code>gid</code>:</p>
     <textarea id="pturls" style="width:100%;min-height:86px" placeholder="https://script.google.com/macros/s/AKfycbwDSY6dviG_LcCf6cOxFJlB57q5StYurDL9VjH8ZivgACpzdQC3wRPFA3Oi-aW0ZSVD/exec">${esc(PTCFG.urls||'')}</textarea>
     <label class="chk" style="display:block"><label><input type="checkbox" id="ptauto" ${PTCFG.auto!==false?'checked':''}>Sincronizar automáticamente</label></label>
     <div class="pdfbtns"><button class="btn sm" id="ptfill">Restaurar enlaces</button><button class="btn primary sm" id="ptgo">🔄 Guardar y actualizar</button></div>
    </div>
   </div>
   <div class="acts">${on?'<button class="btn danger" id="ptdel" style="margin-right:auto">Quitar la relación</button>':''}<button class="btn primary" id="ptdone">Listo</button></div>`;
  $('#modal').classList.add('on');
  box.onclick=async e=>{const t=e.target.closest('button');if(!t)return;
    if(t.id==='ptdone')closeModal();
    else if(t.id==='ptpick')$('#ptfile').click();
    else if(t.id==='ptfill')$('#pturls').value=PT_DEFAULT_URLS;
    else if(t.id==='ptapplypaste'){
      const txt = $('#ptpaste').value.trim();
      if(!txt) return toast('Pega primero el texto o CSV copiado de la hoja');

        const grid = csvGrid(txt);

        if(!part || !part.ev.length) throw new Error('No se detectaron columnas válidas (OE y Cantidad Entregada).');
        ptApply([part], 'Texto pegado directamente', false);
        openPtModal();
        toast('Relación a PT cargada con éxito');
      } catch(err) {
        showMsg('Error al procesar el texto', `<p>${esc(err.message)}</p>`);
      }
    }
    else if(t.id==='ptgo'){const u=$('#pturls').value.trim();if(!u)return toast('Pega al menos un enlace');
      try{toast('Conectando con Google Sheets…');const {parts,errs,failed}=await ptFromUrls(u);PTCFG.urls=u;saveCfg();ptApply(parts,'Google Sheets (enlace publicado)',false,failed);openPtModal();if(errs.length)toast(errs.length+' enlace(s) fallaron')}
      catch(er){showMsg('No se pudo leer el enlace',`<p style="white-space:pre-wrap">${esc(er.message)}</p>`)}}
    else if(t.id==='ptdel'){if(confirm('¿Quitar la relación a PT del dashboard? (No se modifica el Google Sheet)')){S.pt=null;try{localStorage.removeItem(LSP)}catch(e){}PTC=null;closeModal();render()}}};
  box.onchange=e=>{if(e.target.id==='ptdedupe'){PTCFG.dedupe=e.target.checked;saveCfg();PTC=null;render();openPtModal()}
    else if(e.target.id==='ptauto'){PTCFG.auto=e.target.checked;saveCfg()}};
}

/* ============ Pestaña “Relación PT”: ver y buscar dentro de la relación ============ */
const hmin=h=>{const m=String(h||'').match(/(\d{1,2}):(\d{2})\s*([AaPp])?/);if(!m)return 0;let x=+m[1];if(m[3]){x=x%12+(/p/i.test(m[3])?12:0)}return x*60+ +m[2]};
const relOeTxt=k=>'OE'+String(k).padStart(8,'0');
function relBar(p){
  if(!p)return'<span class="pgt mut">No está en el BO</span>';
  if(p.st==='sin')return'<span class="pgt mut">—</span>';
  const w=p.pct==null?0:Math.min(100,p.pct*100);
  return`<div class="pgb" title="${esc(p.tip||'')}"><i class="${p.st}" style="width:${w}%"></i><b>${ptPctTxt(p)}</b></div>`}
const relPeds=(ix,k)=>{const g=ix.grp.get(k);return g?g.map(r=>r.id):[]};
const relPedHtml=ids=>ids.length?ids.slice(0,2).map(id=>`<a href="#" data-goto="${esc(id)}">${esc(id)}</a>`).join(', ')+(ids.length>2?' +'+(ids.length-2):''):'';
function relRows(){
  const R=S.ui.rel,ix=ptIdx(),out=[];
  const q=(R.q||'').toLowerCase().split(/\s+/).filter(Boolean);
  const mk=(o,e)=>{const ids=relPeds(ix,o.k),p=ids.length?ptInfo(S.rows.find(r=>r.id===ids[0])):null;
    return{k:o.k,oe:relOeTxt(o.k),raw:e[11]||relOeTxt(o.k),tab:e[6],clave:e[7]||'',prod:e[8]||'',cli:e[9]||'',nota:e[10]||'',um:e[3]||o.umRaw||'',sol:e[2]||0,q:e[1],d:e[4],h:e[5],acc:o.passed,p,ids}};
  if(R.mode==='oe'){
    for(const o of ix.by.values()){
      const last=o.ev.slice().sort((a,b)=>(b[4]||0)-(a[4]||0))[0];
      const row=mk(o,last);row.n=o.n;row.tabs=Object.keys(o.tabs||{});row.q=o.passed;row.d=o.last;row.h='';
      const te=o.ev.find(e=>e[8])||last;row.prod=te[8]||'';row.cli=(o.ev.find(e=>e[9])||last)[9]||'';row.clave=(o.ev.find(e=>e[7])||last)[7]||'';
      row.nota=[...new Set(o.ev.map(e=>e[10]).filter(Boolean))].join(' | ');out.push(row)}
  }else for(const o of ix.by.values())for(const e of o.ev)out.push(mk(o,e));
  let rows=out.filter(r=>{
    if(R.tab&&!(R.mode==='oe'?r.tabs.includes(R.tab):r.tab===R.tab))return false;
    if(R.bo==='in'&&!r.ids.length)return false;if(R.bo==='out'&&r.ids.length)return false;
    if(q.length){const t=(r.oe+' '+r.raw+' '+r.k+' '+(r.tabs?r.tabs.join(' '):r.tab)+' '+r.clave+' '+r.prod+' '+r.cli+' '+r.nota+' '+r.um+' '+r.ids.join(' ')+' '+(r.d!=null?fmtDate(r.d):'')).toLowerCase();if(!q.every(w=>t.includes(w)))return false}
    return true});
  const sk=R.sk,sd=R.sd,val2=r=>sk==='d'?(r.d==null?-1:r.d*2000+hmin(r.h)):sk==='pct'?(r.p?(r.p.st==='sin'?-1:(r.p.pct||0)):-2):sk==='n'?r.n||0:r[sk];
  rows.sort((a,b)=>{let x=val2(a),y=val2(b);if(typeof x==='number'&&typeof y==='number')return(x-y)*sd;return String(x==null?'':x).localeCompare(String(y==null?'':y),'es',{numeric:true})*sd});
  return rows;
}
function relFill(){
  const R=S.ui.rel,rows=relRows(),oe=R.mode==='oe',cap=1500,shown=rows.slice(0,cap);let h='';
  for(const r of shown){
    h+=oe?`<tr><td class="stk">${esc(r.oe)}</td><td title="${esc(r.prod)}">${esc(r.prod)}</td><td title="${esc(r.cli)}">${esc(r.cli)}</td><td>${esc(r.um)}</td><td class="num">${fmt0(r.sol)}</td><td class="num"><b>${fmt0(r.q)}</b></td><td class="num">${r.n}</td><td>${r.d!=null?fmtDate(r.d):''}</td><td>${esc(r.tabs.map(t=>t.replace(/ 20\d\d$/,'')).join(' + '))}</td><td class="pt-c">${relBar(r.p)}</td><td>${relPedHtml(r.ids)}</td></tr>`
     :`<tr><td class="stk">${r.d!=null?fmtDate(r.d):''}</td><td>${esc(/[:A-Za-z]/.test(r.h)?r.h:'')}</td><td><b>${esc(r.oe)}</b></td><td>${esc(r.tab.replace(/ 20\d\d$/,''))}</td><td>${esc(r.clave)}</td><td title="${esc(r.prod)}">${esc(r.prod)}</td><td title="${esc(r.cli)}">${esc(r.cli)}</td><td>${esc(r.um)}</td><td class="num">${fmt0(r.sol)}</td><td class="num"><b>${fmt0(r.q)}</b></td><td class="num">${fmt0(r.acc)}</td><td class="pt-c">${relBar(r.p)}</td><td>${relPedHtml(r.ids)}</td><td title="${esc(r.nota)}">${esc(r.nota)}</td></tr>`}
  $('#relbody').innerHTML=h||`<tr><td colspan="14"><div class="empty">Sin resultados para esa búsqueda</div></td></tr>`;
  const tot=rows.reduce((s,r)=>s+(r.q||0),0),inb=rows.filter(r=>r.ids.length).length;
  $('#relfoot').innerHTML=`Mostrando <b>${shown.length.toLocaleString()}</b>${rows.length>cap?' de '+rows.length.toLocaleString():''} ${oe?'OE':'pases'} · ${inb.toLocaleString()} ${oe?'están':'son de OE que están'} en el BO actual${rows.length>cap?' · <b>afina la búsqueda para ver el resto</b>':''}${oe?'':' · suma de cantidad entregada: <b>'+fmt0(tot)+'</b> (mezcla unidades; filtra por UM o cliente si quieres un total útil)'}`;
  $('#relclear').hidden=!(R.q||R.tab||R.bo);
}
function renderRel(){
  const R=S.ui.rel=Object.assign({q:'',mode:'pases',tab:'',bo:'',sk:'d',sd:-1},S.ui.rel||{});
  if(!ptOn()){$('#main').innerHTML=`<div class="empty">Aún no hay una relación de material cargada.<br><br><button class="btn primary" data-openpt="1">📦 Conectar o cargar la relación</button></div>`;return}
  const ix=ptIdx(),tabs=[...new Set(S.pt.ev.map(e=>e[6]))];
  const oe=R.mode==='oe';
  const cols=oe?[['oe','OE'],['prod','Producto'],['cli','Cliente'],['um','UM'],['sol','Solicitada'],['q','Pasado a PT'],['n','Pases'],['d','Último pase'],['tab','Hojas'],['pct','Avance (BO)'],['ped','Pedido BO']]
   :[['d','Fecha'],['h','Hora'],['oe','OE'],['tab','Hoja'],['clave','Clave'],['prod','Producto'],['cli','Cliente'],['um','UM'],['sol','Solicitada'],['q','Entregada'],['acc','Acum. de la OE'],['pct','Avance (BO)'],['ped','Pedido BO'],['nota','Notas']];
  const th=cols.map((c,i)=>`<th data-rk="${c[0]}" class="${i===0?'stk':''}">${c[1]}${R.sk===c[0]?`<span class="ar">${R.sd>0?'▲':'▼'}</span>`:''}</th>`).join('');
  $('#main').innerHTML=`<div class="toolbar">
    <input type="search" id="relq" placeholder="Buscar OE, producto, cliente, clave, nota, pedido…" value="${esc(R.q)}" style="width:320px">
    <label class="status">Ver <select id="relmode"><option value="pases">Cada pase a PT</option><option value="oe">Resumen por OE</option></select></label>
    <label class="status">Hoja <select id="reltab"><option value="">Todas</option>${tabs.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('')}</select></label>
    <label class="status">BO <select id="relbo"><option value="">Todas las OE</option><option value="in">Solo las que están en el BO</option><option value="out">Solo las que no están en el BO</option></select></label>
    <button class="btn sm" id="relclear" hidden>✕ Quitar filtros</button><span class="sp"></span>
    <span class="status">${S.pt.ev.length.toLocaleString()} pases · ${ix.by.size.toLocaleString()} OE · sincronizado ${stamp(S.pt.loadedAt)}</span><button class="btn sm" data-openpt="1">📦 Conexión</button></div>
   <div class="tablewrap"><table class="m dense" id="reltbl"><thead><tr>${th}</tr></thead><tbody id="relbody"></tbody></table></div><div class="status" id="relfoot"></div>`;
  $('#relmode').value=R.mode;$('#reltab').value=R.tab;$('#relbo').value=R.bo;relFill();
}

/* ============ Exportar / respaldo ============ */
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function exportCsv(){
  const tab=S.ui.tab==='graf'?'matriz':S.ui.tab,rows=visibleRows(tab);const cols=COLS.filter(c=>!S.ui.hidden.includes(c[0]));
  const q=v=>{v=v==null?'':String(v);return /[",\n\r;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const lines=[cols.map(c=>q(c[1])).concat('Vencido','Notas de junta').join(',')];
  for(const r of rows)lines.push(cols.map(c=>{const v=val(r,c[0]);return q(c[2]==='d'&&isDateLike(v)?fmtDateLong(v):v)}).concat(isOver(r)?'SI':'',q(notesOf(r).map(n=>stamp(n.ts)+': '+n.text).join(' | '))).join(','));
  download('BO_'+(tab==='matriz'?'matriz':'vista')+'_'+toInput(S.consulta)+'.csv','﻿'+lines.join('\r\n'),'text/csv');
}

const mctx=document.createElement('canvas').getContext('2d');
function tw(s,size,bold){mctx.font=(bold?'bold ':'')+'100px Helvetica, Arial, "Liberation Sans", sans-serif';return mctx.measureText(s).width*size/100}
function wrapTxt(text,maxW,size,bold,maxLines){
  const out=[];
  for(const para of String(text==null?'':text).split('\n')){
    const words=para.split(/\s+/).filter(Boolean);let line='';
    if(!words.length){out.push('');continue}
    for(let w of words){
      while(tw(w,size,bold)>maxW&&w.length>1){let i=w.length-1;while(i>1&&tw(w.slice(0,i),size,bold)>maxW)i--;if(line){out.push(line);line=''}out.push(w.slice(0,i));w=w.slice(i)}
      const t=line?line+' '+w:w;
      if(tw(t,size,bold)<=maxW)line=t;else{out.push(line);line=w}
    }
    out.push(line);
  }
  if(maxLines&&out.length>maxLines){out.length=maxLines;let l=out[maxLines-1];while(l.length>1&&tw(l+'…',size,bold)>maxW)l=l.slice(0,-1);out[maxLines-1]=l+'…'}
  return out;
}

  const vnames=Object.keys(vcnt).sort((a,b)=>cmpLabel(vendLabel(a),vendLabel(b)));
  const sel={vends:new Set(vnames),clients:new Set(cnames),groups:new Set(Object.keys(gcnt)),excl:new Set(),onlyNotes:false,onlyOver:false};
  const cand=()=>base.filter(r=>sel.clients.has(val(r,'cliente')||'(sin cliente)')&&sel.vends.has(vendOf(r))&&sel.groups.has(gOf(r))&&(!sel.onlyNotes||notesOf(r).length)&&(!sel.onlyOver||isOver(r)));
  const pick=()=>cand().filter(r=>!sel.excl.has(r.id));
  const box=$('#modalbox');box.classList.add('wide');$('#modal').classList.add('on');
  const secs=[['kpi','Resumen con indicadores'],['est','Gráfica por estatus'],['edad','Gráfica de antigüedad de vencidos'],['cli','Resumen por cliente (con ML y valor)'],['ven','Resumen por vendedor (con ML y valor)'],['det','Detalle de pedidos (tabla)']];
  box.innerHTML=`<h2>📄 Reporte PDF</h2>
   <p class="status" style="margin-top:0">Parte de los <b>${base.length.toLocaleString()}</b> pedidos que ves ahora (${esc(describeForPdf())}). Elige abajo qué incluir; se genera al instante y se descarga.</p>
   <div class="pdfgrid"><div>
     <h3>Secciones</h3><div class="chk">${secs.map(s=>`<label><input type="checkbox" data-sec="${s[0]}" ${o.sec[s[0]]?'checked':''}>${s[1]}</label>`).join('')}</div>
     <h3>Columnas del detalle</h3><div class="pdfbtns"><button class="btn sm" data-pc="def">Recomendadas</button><button class="btn sm" data-pc="all">Todas</button></div>
     <div class="chk cols">${PDFCOLS.map(c=>`<label><input type="checkbox" data-pcol="${c[0]}" ${o.cols.includes(c[0])?'checked':''}>${esc(c[1])}</label>`).join('')}</div>
     <h3>Opciones</h3><div class="chk">
       <label class="status">Agrupar el detalle por <select id="pgroupby"><option value="">— sin agrupar —</option><option value="cliente">Cliente</option><option value="vend">Vendedor</option><option value="info">INFO</option></select> (con ML y valor por grupo)</label>
       <label style="padding-left:20px"><input type="checkbox" id="pnewp" ${o.newpage?'checked':''}>Página nueva por cada grupo</label>
       <label><input type="checkbox" id="ponlyover">Solo pedidos vencidos</label>
       <label><input type="checkbox" id="ponlynotes">Solo pedidos con notas de junta</label></div>
     <div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap"><label class="status">Orden <select id="porder"><option value="venc">Más vencido primero</option><option value="cliente">Por cliente</option><option value="excel">Orden del archivo</option></select></label>
     <label class="status">Hoja <select id="pori"><option value="l">Horizontal</option><option value="p">Vertical</option></select></label></div>
   </div><div>
     <h3>Clientes a incluir</h3><div id="ppick"></div>
     <h3>Vendedores a incluir</h3><div id="ppickv"></div>
     <h3>Estatus a incluir</h3><div class="chk">${Object.keys(gcnt).map(g=>`<label><input type="checkbox" data-pg="${g}" checked><span class="dot ${g}" style="width:9px;height:9px;border-radius:50%;display:inline-block"></span>${GROUPS[g]}<small>${gcnt[g]}</small></label>`).join('')}</div>
     <h3>Pedidos uno por uno <span class="status">(quita los que no quieras)</span></h3>
     <input type="search" id="psearch2" placeholder="Buscar en la lista…" style="width:100%;margin-bottom:4px">
     <div class="pdfbtns"><button class="btn sm" data-pl="on">Marcar visibles</button><button class="btn sm" data-pl="off">Desmarcar visibles</button></div>
     <div class="list" id="plist"></div>
   </div></div>
   <div class="acts" style="align-items:center"><span class="status" style="margin-right:auto">Se incluirán <span class="pdfcount" id="pdfcount"></span></span><button class="btn" id="pdfcancel">Cancelar</button><button class="btn primary" id="pdfgo">⬇ Descargar PDF</button></div>`;
  $('#porder').value=o.order;$('#pgroupby').value=o.groupby||'';$('#pori').value=o.landscape?'l':'p';
  const upd=()=>{const rows=pick();const cl=new Set(rows.map(r=>val(r,'cliente')));$('#pdfcount').textContent=`${rows.length.toLocaleString()} pedidos de ${cl.size} cliente${cl.size===1?'':'s'}`;$('#pdfgo').disabled=!rows.length;$('#pnewp').disabled=!$('#pgroupby').value};
  const renderList=()=>{const q=($('#psearch2').value||'').toLowerCase();
    $('#plist').innerHTML=cand().map(r=>{const t=`${r.id} · ${val(r,'cliente')||''} · ${val(r,'info')||''}${isOver(r)?' · vencido':''}`;return `<label class="row" data-n="${esc(t.toLowerCase())}" ${q&&!t.toLowerCase().includes(q)?'style="display:none"':''}><input type="checkbox" data-pid="${esc(r.id)}" ${sel.excl.has(r.id)?'':'checked'}><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t)}</span></label>`}).join('')||'<div class="empty" style="padding:10px">Sin pedidos con esa selección</div>';upd()};
  $('#ppick').innerHTML=pickerHtml(cnames,cnames.map(v=>({v,label:v,n:cnt[v]})));
  wirePicker($('#ppick'),s=>{sel.clients=new Set(s);renderList()});
  $('#ppickv').innerHTML=pickerHtml(vnames,vnames.map(v=>({v,label:vendLabel(v),n:vcnt[v]})));
  wirePicker($('#ppickv'),s=>{sel.vends=new Set(s);renderList()});
  renderList();
  $('#psearch2').oninput=()=>{const q=$('#psearch2').value.toLowerCase();$('#plist').querySelectorAll('label.row').forEach(l=>l.style.display=l.dataset.n.includes(q)?'':'none')};
  box.onchange=e=>{const t=e.target;
    if(t.dataset.sec){o.sec[t.dataset.sec]=t.checked?1:0}
    else if(t.dataset.pcol){o.cols=PDFCOLS.map(c=>c[0]).filter(k=>k===t.dataset.pcol?t.checked:o.cols.includes(k))}
    else if(t.dataset.pg){t.checked?sel.groups.add(t.dataset.pg):sel.groups.delete(t.dataset.pg);renderList()}
    else if(t.dataset.pid){t.checked?sel.excl.delete(t.dataset.pid):sel.excl.add(t.dataset.pid);upd()}
    else if(t.id==='pgroupby'){o.groupby=t.value;upd()}
    else if(t.id==='pnewp')o.newpage=t.checked;
    else if(t.id==='ponlyover'){sel.onlyOver=t.checked;renderList()}
    else if(t.id==='ponlynotes'){sel.onlyNotes=t.checked;renderList()}
    else if(t.id==='porder')o.order=t.value;
    else if(t.id==='pori')o.landscape=t.value==='l';
    persist()};
  box.onclick=e=>{const t=e.target.closest('button');if(!t)return;
    if(t.dataset.pc){o.cols=t.dataset.pc==='all'?PDFCOLS.map(c=>c[0]):PDF_DEF.slice();box.querySelectorAll('[data-pcol]').forEach(i=>i.checked=o.cols.includes(i.dataset.pcol));persist()}
    else if(t.dataset.pl){box.querySelectorAll('#plist label.row').forEach(l=>{if(l.style.display==='none')return;const cb=l.querySelector('input');cb.checked=t.dataset.pl==='on';cb.checked?sel.excl.delete(cb.dataset.pid):sel.excl.add(cb.dataset.pid)});upd()}
    else if(t.id==='pdfcancel')closeModal();
    else if(t.id==='pdfgo'){
      const rows=sortForPdf(pick(),o.order);if(!rows.length)return;
      t.disabled=true;t.textContent='Generando…';
      const allCl=sel.clients.size===cnames.length;
      let desc=describeForPdf();if(!allCl)desc+='  ·  Clientes incluidos: '+[...sel.clients].sort().join(', ');
      if(sel.vends.size<vnames.length)desc+='  ·  Vendedores incluidos: '+[...sel.vends].map(vendLabel).sort(cmpLabel).join(', ');
      if(sel.groups.size<Object.keys(gcnt).length)desc+='  ·  Estatus incluidos: '+[...sel.groups].map(g=>GROUPS[g]).join(', ');
      if(sel.excl.size)desc+='  ·  '+sel.excl.size+' pedido(s) excluidos a mano';
      if(sel.onlyOver)desc+='  ·  Solo vencidos';if(sel.onlyNotes)desc+='  ·  Solo con notas de junta';
      setTimeout(async()=>{try{
        const bytes=await buildPdf(rows,{...o,desc});
        download('BO_reporte_'+toInput(todaySerial())+'.pdf',bytes,'application/pdf');
        toast('PDF generado: '+rows.length+' pedidos');closeModal();
      }catch(err){console.error(err);t.disabled=false;t.textContent='⬇ Descargar PDF';toast('No se pudo generar el PDF: '+err.message)}},30);
    }};
}

/* ============ Eventos ============ */
function rePanel(){if(!S.fpOpen)return;const bd=document.querySelector('#fpanel .bd'),st=bd?bd.scrollTop:0;renderFPanel();const b2=document.querySelector('#fpanel .bd');if(b2)b2.scrollTop=st}
const gF=()=>S.ui.g.f;
document.addEventListener('click',e=>{
  const t=e.target;
  const dv=t.closest('[data-delview]');if(dv){const v=viewById(dv.dataset.delview);if(v&&confirm('¿Eliminar la vista "'+v.name+'"?\nLos pedidos no se borran, solo la pestaña.')){S.views=S.views.filter(x=>x!==v);if(S.ui.tab==='v:'+v.id)S.ui.tab='matriz';if(S.ui.g.scope==='v:'+v.id)S.ui.g.scope='matriz';persist();render();toast('Vista eliminada')}return}
  if(t.closest('#vendbtn'))return openVendModal();
  const dre=t.closest('[data-dr]');if(dre){drill(+dre.dataset.dr);return}
  if(!t.closest('.wrap'))document.querySelectorAll('.pop').forEach(p=>p.hidden=true);
  const tabEl=t.closest('[data-tab]');
  if(tabEl){S.ui.tab=tabEl.dataset.tab;S.sort={key:null,dir:1};persist();closeDrawer();render();return}
  if(t.closest('#addview'))return openViewModal(null);
  if(t.closest('#loadbtn'))return $('#file').click();
  if(t.closest('#ptbtn')||t.closest('[data-openpt]'))return openPtModal();
  if(t.closest('#kpitog')){S.ui.kpiHide=!S.ui.kpiHide;persist();return render()}
  const gt=t.closest('[data-goto]');if(gt){e.preventDefault();return goToPedido(gt.dataset.goto,'matriz')}
  if(t.closest('#relclear')){Object.assign(S.ui.rel,{q:'',tab:'',bo:''});persist();return renderRel()}
  const rk=t.closest('#reltbl th[data-rk]');if(rk){const R=S.ui.rel,k=rk.dataset.rk;if(R.sk===k)R.sd=-R.sd;else{R.sk=k;R.sd=(k==='d'||k==='q'||k==='pct'||k==='n'||k==='acc'||k==='sol')?-1:1}persist();return renderRel()}
  if(t.closest('#ptsync'))return ptRefreshUrls(false);
  if(t.closest('#hoy')){S.consulta=todaySerial();$('#fconsulta').value=toInput(S.consulta);return render()}
  if(t.closest('#menubtn')){const m=$('#menu');m.hidden=!m.hidden;return}
  if(t.closest('#expcsv'))return exportCsv();
  if(t.closest('#expbk'))return exportBackup();
  if(t.closest('#impbk'))return $('#bkfile').click();
  if(t.closest('#theme')){const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');S.ui.theme=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=S.ui.theme;persist();return}
  if(t.closest('#reset')){if(confirm('Se borrarán TODAS las notas, vistas y datos editados de este navegador. ¿Continuar?')){S.overrides={};S.notes={};S.views=[];S.ui.tab='matriz';persist();render();$('#menu').hidden=true}return}
  if(t.closest('#pdfbtn'))return openPdfModal();
  /* panel de filtros */
  if(t.closest('#fbtn')){S.fpOpen?closeFPanel():openFPanel();return}
  if(t.closest('#fclose')||t.closest('#fclose2'))return closeFPanel();
  if(t.closest('#fclear')||t.closest('#clearAll')){S.filters[S.ui.tab]=blankF();renderMatrix();rePanel();return}
  const cs=t.closest('[data-colset]');if(cs){S.ui.hidden=cs.dataset.colset==='all'?[]:KEYS.filter(k=>!ESS.includes(k));persist();renderMatrix();rePanel();return}
  if(t.closest('#saveView')){const ff=filt('matriz');return openViewModal(null,{clients:ff.clients,vendors:ff.vends||[]})}
  if(t.closest('#editView'))return openViewModal(viewById(S.ui.tab.slice(2)));
  if(t.closest('#dense')){S.ui.dense=!S.ui.dense;persist();return renderMatrix()}
  const g=t.closest('[data-g]');if(g&&g.classList.contains('chip')){const f=filt(S.ui.tab),k=g.dataset.g;f.groups=f.groups.includes(k)?f.groups.filter(x=>x!==k):[...f.groups,k];refreshTable();rePanel();return}
  const pp=t.closest('[data-pt]');if(pp&&pp.classList.contains('chip')){const f=filt(S.ui.tab),k=pp.dataset.pt;f.pt=(f.pt||[]).includes(k)?f.pt.filter(x=>x!==k):[...(f.pt||[]),k];refreshTable();rePanel();return}
  const dd=t.closest('[data-d]');if(dd){const f=filt(S.ui.tab);f.diff=f.diff===dd.dataset.d?'':dd.dataset.d;refreshTable();rePanel();return}
  if(t.closest('[data-clrids]')){const f=filt(S.ui.tab);f.ids=null;f.idsTitle='';refreshTable();rePanel();return}
  /* gráficos */
  const gg=t.closest('[data-gg]');if(gg){const f=gF(),k=gg.dataset.gg;f.groups=f.groups.includes(k)?f.groups.filter(x=>x!==k):[...f.groups,k];persist();syncGCtl();renderGOut();return}
  const gs=t.closest('[data-gcset]');if(gs){S.ui.g.charts=gs.dataset.gcset==='all'?CHARTS.map(c=>c.id):['pt','ven','avgv','avga'];persist();syncGCtl();renderGOut();return}
  if(t.closest('#gclear')){S.ui.g.f={clients:[],groups:[],venc:''};persist();renderGraficos();return}
  /* tabla y panel de edición */
  const th=t.closest('#tbl th');if(th){const k=th.dataset.k;if(S.sort.key===k){if(S.sort.dir===1)S.sort.dir=-1;else S.sort={key:null,dir:1}}else S.sort={key:k,dir:1};return renderMatrix()}
  const gh=t.closest('#tbl tr.grp');if(gh&&gh.dataset.grp){const id=gh.dataset.grp;S.collapsed.has(id)?S.collapsed.delete(id):S.collapsed.add(id);refreshTable();return}
  const tr=t.closest('#tbl tbody tr');if(tr){const nb=t.closest('[data-note]');if(nb||t.closest('td.stk')){if(!window.getSelection().toString()||nb)openDrawer(tr.dataset.id,!!nb)}return}
  if(t.closest('#dclose')||t===$('#scrim'))return closeDrawer();
  if(t.closest('#addnote'))return addNote();
  const del=t.closest('[data-del]');if(del){const id=S.open;S.notes[id]=(S.notes[id]||[]).filter(n=>String(n.ts)!==del.dataset.del);persist();openDrawer(id);refreshTable();return}
  const rv=t.closest('[data-rv]');if(rv){const id=S.open,k=rv.dataset.rv;delete S.overrides[id][k];if(!Object.keys(S.overrides[id]).length)delete S.overrides[id];persist();openDrawer(id);refreshTable();return}
  if(t===$('#modal')&&!$('#vsave')&&!$('#pdfgo')&&!$('#ldAll'))closeModal();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='relq'){clearTimeout(window._rqt);window._rqt=setTimeout(()=>{S.ui.rel.q=t.value;persist();relFill()},130)}
  if(t.id==='q'){clearTimeout(window._qt);window._qt=setTimeout(()=>{filt(S.ui.tab).q=t.value;refreshTable()},130)}
});
document.addEventListener('change',e=>{
  const t=e.target,d=t.dataset||{};
  if(t.id==='onlyOver'){filt(S.ui.tab).venc=t.checked?'over':'';refreshTable();rePanel()}
  else if(t.id==='groupby'){S.ui.groupBy=t.value;S.collapsed.clear();persist();refreshTable()}
  else if(t.id==='mode'){S.ui.mode=t.value;persist();renderMatrix()}
  else if(d.fg){const f=filt(S.ui.tab);f.groups=t.checked?[...f.groups,d.fg]:f.groups.filter(x=>x!==d.fg);refreshTable()}
  else if(d.fpt){const f=filt(S.ui.tab);f.pt=t.checked?[...(f.pt||[]),d.fpt]:(f.pt||[]).filter(x=>x!==d.fpt);refreshTable()}
  else if(t.id==='ptfile'){if(t.files.length)loadPtFiles([...t.files]);t.value=''}
  else if(t.id==='relmode'||t.id==='reltab'||t.id==='relbo'){const R=S.ui.rel;if(t.id==='relmode'){R.mode=t.value;R.sk=t.value==='oe'?'oe':'d';R.sd=t.value==='oe'?1:-1}else if(t.id==='reltab')R.tab=t.value;else R.bo=t.value;persist();renderRel()}
  else if(t.id==='fvenc'){filt(S.ui.tab).venc=t.value;refreshTable()}
  else if(t.id==='fnotes'){filt(S.ui.tab).notes=t.checked;refreshTable()}
  else if(t.id==='fdiff'){filt(S.ui.tab).diff=t.value;refreshTable()}
  else if(t.id==='fids'){if(!t.checked){const f=filt(S.ui.tab);f.ids=null;f.idsTitle='';refreshTable();rePanel()}}
  else if(d.fc){const k=d.fc;S.ui.hidden=t.checked?S.ui.hidden.filter(x=>x!==k):[...S.ui.hidden,k];persist();renderMatrix()}
  else if(t.id==='gscope'){S.ui.g.scope=t.value;persist();renderGraficos()}
  else if(t.id==='gvenc'){gF().venc=t.value;persist();renderGOut()}
  else if(d.gc){const s=new Set(S.ui.g.charts);t.checked?s.add(d.gc):s.delete(d.gc);S.ui.g.charts=CHARTS.map(c=>c.id).filter(id=>s.has(id));persist();syncGCtl();renderGOut()}
  else if(t.id==='cmeas'||t.id==='cdim'||t.id==='ctop'||t.id==='corder'||t.id==='cshow'){const c=S.ui.g.custom;
    if(t.id==='cmeas')c.measure=t.value;else if(t.id==='cdim')c.dim=t.value;else if(t.id==='ctop')c.top=+t.value;else if(t.id==='corder')c.order=t.value;else c.show=t.checked;
    persist();renderGOut()}
  else if(/^cmp(a|b|m|d|top)$/.test(t.id)){const cm=S.ui.g.cmp;
    if(t.id==='cmpa')cm.a=t.value==='auto'?null:+t.value;else if(t.id==='cmpb')cm.b=t.value==='auto'?null:+t.value;else if(t.id==='cmpm')cm.measure=t.value;else if(t.id==='cmpd')cm.dim=t.value;else cm.top=+t.value;
    persist();renderGOut()}
  else if(t.id==='fconsulta'){const s=fromInput(t.value);if(s){S.consulta=s;render();if(S.open)openDrawer(S.open)}}
  else if(t.id==='file'){if(t.files[0])loadFile(t.files[0]);t.value=''}
  else if(t.id==='bkfile'){if(t.files[0])importBackup(t.files[0]);t.value=''}
  else if(d.f&&S.open){ // edición de campo en el panel del pedido
    const id=S.open,k=d.f,r=S.rows.find(x=>x.id===id),ty=TYPE[k];let nv;
    if(ty==='d'&&t.type==='date')nv=fromInput(t.value);
    else if(ty==='n0'||ty==='n2')nv=t.value===''?null:parseFloat(t.value);
    else nv=t.value.trim()===''?null:t.value.trim();
    const base=r.v[IDX[k]];
    if(JSON.stringify(nv)===JSON.stringify(base==null?null:base)){if(S.overrides[id]){delete S.overrides[id][k];if(!Object.keys(S.overrides[id]).length)delete S.overrides[id]}}
    else(S.overrides[id]||(S.overrides[id]={}))[k]={v:nv,base:base==null?null:base};
    persist();openDrawer(id);refreshTable();
  }
});
document.addEventListener('focusout',e=>{
  const t=e.target;if(t.classList&&t.classList.contains('tx')&&S.open){const n=t.closest('.note'),ts=+n.dataset.ts,note=(S.notes[S.open]||[]).find(x=>x.ts===ts);const tx=t.textContent.trim();if(note&&tx&&tx!==note.text){note.text=tx;persist();refreshTable()}}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeDrawer();closeModal();document.querySelectorAll('.pop').forEach(p=>p.hidden=true)}
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&e.target.id==='newnote')addNote();
});
/* mover pestañas de vistas arrastrándolas */
let dragV=null;
const clearDO=()=>document.querySelectorAll('.dragover').forEach(x=>x.classList.remove('dragover'));
document.addEventListener('dragstart',e=>{const t=e.target.closest&&e.target.closest('.vtab');if(t){dragV=t.dataset.vid;t.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','vtab')}});
document.addEventListener('dragover',e=>{if(!dragV)return;const t=e.target.closest('.vtab,#addview,[data-tab="matriz"]');if(t){e.preventDefault();clearDO();t.classList.add('dragover')}});
document.addEventListener('drop',e=>{if(!dragV)return;e.preventDefault();const t=e.target.closest('.vtab,#addview,[data-tab="matriz"]');
  if(t){if(t.id==='addview')moveView(dragV,null);else if(t.dataset.tab==='matriz')moveView(dragV,'FIRST');else if(t.dataset.vid&&t.dataset.vid!==dragV)moveView(dragV,t.dataset.vid)}
  clearDO();dragV=null});
document.addEventListener('dragend',()=>{dragV=null;clearDO();document.querySelectorAll('.dragging').forEach(x=>x.classList.remove('dragging'))});
/* tooltip */
const tip=$('#tip');
document.addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tip.style.display='none';return}
  tip.textContent=t.dataset.tip;tip.style.display='block';const w=tip.offsetWidth;tip.style.left=Math.min(e.clientX+12,innerWidth-w-8)+'px';tip.style.top=(e.clientY+14)+'px'});
/* arrastrar archivos al navegador */
let dragN=0;const hasFiles=e=>e.dataTransfer&&[...(e.dataTransfer.types||[])].includes('Files');
addEventListener('dragenter',e=>{if(!hasFiles(e))return;e.preventDefault();dragN++;document.body.classList.add('dragging')});
addEventListener('dragleave',e=>{if(!hasFiles(e))return;dragN=Math.max(0,dragN-1);if(!dragN)document.body.classList.remove('dragging')});
addEventListener('dragover',e=>{if(hasFiles(e))e.preventDefault()});
addEventListener('drop',e=>{if(!hasFiles(e))return;e.preventDefault();dragN=0;document.body.classList.remove('dragging');const f=e.dataTransfer.files[0];if(f)loadFile(f)});
addEventListener('pagehide',persistNow);addEventListener('beforeunload',persistNow);document.addEventListener('visibilitychange',()=>{if(document.hidden)persistNow()});
boot();
